<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  :root {
    --bg: #0b0f0c;
    --board-bg: #10160f;
    --grid-line: #182018;
    --snake-head: #4ade80;
    --snake-body: #22c55e;
    --food: #f97316;
    --text: #e5f5e9;
    --muted: #6b8f74;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", Consolas, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    letter-spacing: 1px;
  }
  .hud .label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .hud .score {
    font-size: 28px;
    font-weight: bold;
    color: var(--snake-head);
    text-shadow: 0 0 8px rgba(74, 222, 128, 0.5);
  }
  .hud .best {
    font-size: 14px;
    color: var(--muted);
  }
  canvas {
    background: var(--board-bg);
    border: 2px solid var(--snake-body);
    box-shadow: 0 0 24px rgba(34, 197, 94, 0.25);
    image-rendering: pixelated;
  }
  .msg {
    min-height: 20px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    background: rgba(11, 15, 12, 0.85);
    color: var(--text);
    font-size: 20px;
  }
  .board-container {
    position: relative;
  }
  .overlay.show { display: flex; }
  .overlay .sub {
    font-size: 13px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hud" style="width: 400px;">
      <div>
        <div class="label">Score</div>
        <div class="score" id="score">0</div>
      </div>
      <div style="text-align:right;">
        <div class="label">Best</div>
        <div class="best" id="best">0</div>
      </div>
    </div>
    <div class="board-container">
      <canvas id="game" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <div id="overlayText">Game Over</div>
        <div class="sub">Press Space or tap board to restart</div>
      </div>
    </div>
    <div class="msg">Use Arrow Keys to move</div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayText = document.getElementById('overlayText');

  const GRID = 20;
  const CELLS = canvas.width / GRID; // 20x20
  const START_SPEED = 130; // ms per tick
  let speed = START_SPEED;

  let snake, dir, nextDir, food, score, best, running, gameOver, timer;

  best = parseInt(localStorage.getItem('snake_best') || '0', 10) || 0;
  bestEl.textContent = best;

  function resetGame() {
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = START_SPEED;
    gameOver = false;
    scoreEl.textContent = score;
    placeFood();
    overlay.classList.remove('show');
    if (timer) clearInterval(timer);
    timer = setInterval(tick, speed);
    running = true;
  }

  function placeFood() {
    let valid = false;
    let pos;
    while (!valid) {
      pos = {
        x: Math.floor(Math.random() * CELLS),
        y: Math.floor(Math.random() * CELLS)
      };
      valid = !snake.some(s => s.x === pos.x && s.y === pos.y);
    }
    food = pos;
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall collision
    if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS) {
      return endGame();
    }
    // self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return endGame();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      // speed up slightly, with a floor
      if (speed > 60) {
        speed -= 3;
        clearInterval(timer);
        timer = setInterval(tick, speed);
      }
    } else {
      snake.pop();
    }

    draw();
  }

  function endGame() {
    gameOver = true;
    running = false;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      bestEl.textContent = best;
      overlayText.textContent = 'New Best! ' + best;
    } else {
      overlayText.textContent = 'Game Over — Score ' + score;
    }
    overlay.classList.add('show');
  }

  function draw() {
    // background
    ctx.fillStyle = getCss('--board-bg');
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // grid
    ctx.strokeStyle = getCss('--grid-line');
    ctx.lineWidth = 1;
    for (let i = 1; i < CELLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * GRID, 0);
      ctx.lineTo(i * GRID, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * GRID);
      ctx.lineTo(canvas.width, i * GRID);
      ctx.stroke();
    }

    // food
    ctx.fillStyle = getCss('--food');
    roundRect(food.x * GRID + 3, food.y * GRID + 3, GRID - 6, GRID - 6, 4);
    ctx.fill();

    // snake
    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? getCss('--snake-head') : getCss('--snake-body');
      roundRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2, 5);
      ctx.fill();
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function getCss(varName) {
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }

  window.addEventListener('keydown', (e) => {
    const key = e.key;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(key)) {
      e.preventDefault();
    }
    if (gameOver && key === ' ') {
      resetGame();
      return;
    }
    if (!running) return;

    if (key === 'ArrowUp' && dir.y === 0) nextDir = { x: 0, y: -1 };
    else if (key === 'ArrowDown' && dir.y === 0) nextDir = { x: 0, y: 1 };
    else if (key === 'ArrowLeft' && dir.x === 0) nextDir = { x: -1, y: 0 };
    else if (key === 'ArrowRight' && dir.x === 0) nextDir = { x: 1, y: 0 };
  });

  overlay.addEventListener('click', () => {
    if (gameOver) resetGame();
  });

  resetGame();
  draw();
})();
</script>
</body>
</html>
